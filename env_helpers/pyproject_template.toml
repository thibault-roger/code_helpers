# pyproject_template.toml
#
# Ready-to-use Poetry project template for data analyst projects.
# Copy to your project root as pyproject.toml and adjust as needed.
#
# Usage:
#   cp pyproject_template.toml /path/to/my-project/pyproject.toml
#   cd /path/to/my-project
#   poetry install

[tool.poetry]
name        = "my-project"
version     = "0.1.0"
description = ""
authors     = ["Your Name <you@example.com>"]
readme      = "README.md"
packages    = []           # empty = no installable package, just scripts

# ---------------------------------------------------------------------------
# Main dependencies — installed in all environments
# ---------------------------------------------------------------------------
[tool.poetry.dependencies]
python = ">=3.11,<4.0"

# Data manipulation
pandas  = ">=2.0"
polars  = ">=0.20"
pyarrow = ">=14.0"       # Parquet support for both pandas and polars

# Visualization
plotly     = ">=5.0"
matplotlib = ">=3.7"
seaborn    = ">=0.13"

# Connectivity
requests    = ">=2.31"
python-hcl2 = ">=4.0"   # HCL schema parsing

# Excel support (for pd.read_excel / pl.read_excel)
openpyxl = ">=3.1"

# ---------------------------------------------------------------------------
# Dev dependencies — linting, formatting, testing
# Install with: poetry install --with dev
# ---------------------------------------------------------------------------
[tool.poetry.group.dev.dependencies]
ruff     = ">=0.4"       # linter + formatter (replaces flake8, isort, black)
pytest   = ">=8.0"
pytest-cov = ">=5.0"     # coverage reports

# ---------------------------------------------------------------------------
# Notebook dependencies — Jupyter environment
# Install with: poetry install --with notebook
# ---------------------------------------------------------------------------
[tool.poetry.group.notebook.dependencies]
jupyterlab = ">=4.0"
ipykernel  = ">=6.0"

# ---------------------------------------------------------------------------
# Dremio / Arrow Flight (optional — uncomment if needed)
# ---------------------------------------------------------------------------
# [tool.poetry.group.dremio.dependencies]
# pyarrow = ">=14.0"     # already in main, no duplicate needed

# ---------------------------------------------------------------------------
# Ruff configuration (linting + formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"

# ---------------------------------------------------------------------------
# Build system (required by Poetry — do not change)
# ---------------------------------------------------------------------------
[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
